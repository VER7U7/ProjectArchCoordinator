syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.VER7U7.proto";
option csharp_namespace = "HubServer.Proto";

message ServerMessage {
  oneof payload {
    RegisterRequest register_request = 1;
    RegisterResponse register_response = 2;
  }
}

message RegisterRequest {
  string ip = 1;
  int32 port = 2;
  int32 max_players = 3;
}

message RegisterResponse {
  bool success = 1;
  string server_id = 2;
}